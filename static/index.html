    // ================= 群发功能 =================
    let cbImages = [];   // 群发栏待发图片 [{name, data_url}]

    // 渲染群发栏图片缩略图
    function renderCbThumbs() {
        const box = $('cbThumbs');
        if (!box) return;
        box.innerHTML = '';
        if (!cbImages.length) { box.style.display = 'none'; return; }
        box.style.display = 'flex';
        cbImages.forEach((img, i) => {
            const thumb = el('div', 'cb-thumb');
            const im = el('img'); im.src = img.data_url;
            const x = el('span', 'cb-thumb-x', '×');
            x.addEventListener('click', () => { cbImages.splice(i, 1); renderCbThumbs(); });
            thumb.appendChild(im); thumb.appendChild(x);
            box.appendChild(thumb);
        });
    }

    // 更新群发目标提示文字
    function updateCbTarget() {
        const target = $('cbTarget');
        if (!target) return;
        const visible = tasks.filter(t => t.status !== 'removed' && !t.detached);
        const n = visible.length;
        if (n === 0) { target.textContent = '⚠️ 大屏上没有模型，请先从左侧点击添加'; }
        else { target.textContent = '群发给大屏上的 ' + n + ' 个模型'; }
    }

    // 群发核心：把消息+图片同时发给大屏上所有活跃卡片
    async function broadcastSend() {
        const inp = $('cbInput');
        const message = inp ? inp.value.trim() : '';
        const hasImages = cbImages.length > 0;
        if (!message && !hasImages) return;

        // 筛选大屏上可见且非 running 的卡片
        const visibleTasks = tasks.filter(t => t.status !== 'removed' && !t.detached);
        if (visibleTasks.length === 0) {
            flashTitle('⚠️ 大屏上没有模型，请先从左侧点击添加');
            return;
        }

        // 遍历每个卡片，填入消息并触发发送
        let sentCount = 0;
        for (const task of visibleTasks) {
            if (task.status === 'running') continue;   // 正在跑的跳过

            // 填入文本到卡片的 textarea
            const ta = $('in-' + task.task_id);
            if (ta) {
                ta.value = message;
                autoGrow(ta);
            }

            // 对于 vision 模型，复制群发图片
            if (hasImages && task.vision) {
                task.images = cbImages.map(img => ({ name: img.name, data_url: img.data_url }));
            }

            // 触发该卡片的发送（sendTask 会读 textarea 值和 task.images）
            sendTask(task.task_id);
            sentCount++;
        }

        // 清空群发栏
        if (inp) { inp.value = ''; inp.style.height = 'auto'; inp.style.height = '110px'; }
        cbImages = [];
        renderCbThumbs();

        if (sentCount > 0) {
            flashTitle('📢 已群发给 ' + sentCount + ' 个模型');
        } else {
            flashTitle('所有模型都在运行中，稍后再群发');
        }
        updateCbTarget();
    }

    // 绑定群发栏事件
    (function bindBroadcastEvents() {
        const btn = $('cbSend');
        const inp = $('cbInput');
        const fileInput = $('cbFile');

        // 发送按钮
        if (btn) btn.addEventListener('click', broadcastSend);

        // Enter 发送 / Shift+Enter 换行
        if (inp) inp.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); broadcastSend(); }
        });

        // 图片上传
        if (fileInput) fileInput.addEventListener('change', () => {
            Array.from(fileInput.files || []).forEach(f => {
                if (!f.type.startsWith('image/')) { flashTitle('只支持图片文件'); return; }
                if (f.size > MAX_IMAGE_BYTES) { flashTitle('单张图片不能超过 5MB'); return; }
                if (cbImages.length >= MAX_IMAGES) { flashTitle('最多 ' + MAX_IMAGES + ' 张图片'); return; }
                const reader = new FileReader();
                reader.onload = () => {
                    cbImages.push({ name: f.name, data_url: reader.result });
                    renderCbThumbs();
                };
                reader.readAsDataURL(f);
            });
            fileInput.value = '';
        });
    })();


    // ================= 【持久化】localStorage 会话存取 =================
    // 契约：localStorage key = 'mt_chats_v1'
    // 结构：{ version:1, savedAt:毫秒, cardSeq:number,
    //         cards:[{ model_id, model_label, model_type, model_vision,
    //                  messages:[{role:'user'|'assistant', content:string}], tokens:{prompt,completion,total} }] }
    // 注意：图片（data_url）不入档，仅存文本历史，防止超出 5MB 配额。
    const STORAGE_KEY = 'mt_chats_v1';

    function loadArchive() {
        try {
            const a = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (a && a.version === 1 && Array.isArray(a.cards)) return a;
        } catch (e) { /* 存档损坏：当作无存档 */ }
        return null;
    }

    // 保存当前所有有效卡片的对话（removed 卡自动排除；running 卡存已落库的历史）
    function saveChats() {
        try {
            const cards = tasks
                .filter(t => t.status !== 'removed' && t.messages.length > 0)
                .map(t => ({
                    model_id: t.model_id,
                    model_label: t.model_label,
                    model_type: t.type,
                    model_vision: !!t.vision,
                    messages: t.messages.slice(-200),   // 上限保护，防止单卡无限膨胀
                    fusion: t.fusion || undefined,   // 【多模型融合】融合结构随存档（undefined 序列化时自动省略）
                    tokens: t.tokens || { prompt:0, completion:0, total:0 },
                }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                version: 1, savedAt: Date.now(), cardSeq: cardSeq, cards: cards,
            }));
        } catch (e) {
            console.warn('【持久化】保存失败（可能超 localStorage 配额）', e);
        }
    }

    // 把已回填 messages 的 task 重放到 DOM（恢复时调用）
    function replayTaskMessages(task) {
        const chat = $('chat-' + task.task_id);
        if (!chat) return;
        task.messages.forEach(m => renderHistoryMsg(chat, m));   // 【融合配套】统一渲染（含 fusion_merge 分隔线 / fusionDetail 折叠区）
        chat.scrollTop = chat.scrollHeight;
    }

    // 页面加载时恢复上次对话：逐卡 addCard → 回填 messages/tokens → 重放渲染
    async function restoreChats() {
        const archive = loadArchive();
        if (!archive || !archive.cards.length) return;
        cardSeq = archive.cardSeq || cardSeq;   // 续接 task_id 计数，避免同毫秒冲突
        for (const c of archive.cards) {
            // 优先匹配现役模型；模型已被删除则用存档元数据构造离线卡（历史仍可看）
            const model = MODELS.find(m => m.id === c.model_id) || {
                id: c.model_id,
                label: c.model_label || c.model_id,
                type: c.model_type || 'api',
                vision: !!c.model_vision,
            };
            addCard(model);
            const task = tasks[tasks.length - 1];
            if (!task || task.model_id !== c.model_id) break;   // 卡位已满被拒时防错配
            task.messages = Array.isArray(c.messages) ? c.messages : [];
            task.fusion = c.fusion || null;   // 【多模型融合】融合结构恢复
            if (task.fusion) renderFusionBadge(task);
            task.tokens = c.tokens || { prompt:0, completion:0, total:0 };
            replayTaskMessages(task);
        }
        updateStageRows();
        if (archive.cards.length) flashTitle('💾 已恢复上次对话记录');
    }

    // ================= 启动 =================
    async function refreshModels() {
        try {
            const res = await fetch('/models');
            const data = await res.json();
            MODELS = data.models || [];
            DEFAULT_MODEL = data.default || (MODELS[0] && MODELS[0].id) || '';
        } catch (e) { console.error('加载模型列表失败', e); MODELS = []; }
        renderModelList();
    }

    // ================= 【后端记忆】卡片对话同步到 /memory/chats（契约 v1，成败都同步） =================
    async function syncTaskMemory(task) {
        try {
            if (!task || !task.task_id) return;
            const msgs = (task.messages || [])
                .filter(m => m && (m.role === 'user' || m.role === 'assistant') && (m.content || '').trim())
                .map(m => ({ role: m.role, content: m.content }));
            await fetch('/memory/chats', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: task.task_id, model_id: task.model_id || '',
                    model_label: fuseChainLabel(task),   // 【多模型融合】融合卡链名：A + B（裁判 X）
                    status: task.status === 'error' ? 'error' : 'ok',
                    error_msg: task.status === 'error' ? (task.error_msg || '未知错误') : null,
                    messages: msgs,
                }),
                keepalive: true,
            });
        } catch (e) { console.warn('[后端记忆] 同步失败（不影响本地存档）:', e); }
    }

    // ================= 【记忆宫殿】对话思维导图（数据源：后端 /memory/chats + 前端 tasks[].messages） =================
    // 契约：window.palOpen() 打开；链 = 模型任务(task)，卡片 = 一轮问答（精简摘要）；点卡片 → 完整历史弹窗
    const PAL_COLORS = ['#4f8cff', '#a06bff', '#ff8c42', '#2fbf8f', '#e5534b', '#d4a72c'];
    const PAL_CW = 240, PAL_GAP = 90, PAL_ROW_H = 205, PAL_PAD_X = 155, PAL_PAD_Y = 60;
    let palUI = null, palDragged = false;

    function palEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // 每个有消息的任务 = 一条链；messages 按 user/assistant 配对成一轮问答
    function palBuildData() {
        const chains = [];
        tasks.forEach((t, ci) => {
            if (t.status === 'removed') return;   // 已叉掉的卡片：与存档同步移出，不进记忆宫殿
            const msgs = (t.messages || []).filter(m => m && (m.role === 'user' || m.role === 'assistant') && (m.content || '').trim());
            if (!msgs.length) return;
            const chain = { id: t.task_id, label: fuseChainLabel(t), color: PAL_COLORS[ci % PAL_COLORS.length], cards: [], enabled: true,
                            status: t.status === 'error' ? 'error' : 'ok', errorMsg: t.error_msg || null,
                            updatedAt: new Date().toISOString(), src: 'local' };
            msgs.forEach(m => {
                const last = chain.cards[chain.cards.length - 1];
                if (m.role === 'user') chain.cards.push({ round: chain.cards.length + 1, qFull: m.content, aFull: '', pending: true });
                else if (last && last.pending) { last.aFull = m.content; last.pending = false; }
                else chain.cards.push({ round: chain.cards.length + 1, qFull: '', aFull: m.content, pending: false });
            });
            chains.push(chain);
        });
        return chains;
    }

    function palRender() {
        const d = palUI, world = d.world;
        world.querySelectorAll('.pal-card, .pal-chain-tag, .pal-world-empty').forEach(n => n.remove());
        d.cards = []; d.byUid = {};
        let maxX = 0;
        d.chains.forEach((ch, ci) => {
            const y = PAL_PAD_Y + ci * PAL_ROW_H;
            const tag = el('div', 'pal-chain-tag');
            tag.style.top = (y + 52) + 'px';
            tag.innerHTML = '<span class="pal-dot" style="background:' + ch.color + '"></span><span class="pal-tag-t">' + palEsc(ch.label) + '</span><span class="pal-tag-n">' + ch.cards.length + ' 轮</span>';
            if (ch.status === 'error') { tag.classList.add('failed'); tag.innerHTML = '⚠ ' + tag.innerHTML; }
            world.appendChild(tag);
            ch.cards.forEach((c, ri) => {
                c.uid = ch.id + '#' + c.round; c.chain = ch;
                c.x = PAL_PAD_X + ri * (PAL_CW + PAL_GAP); c.y = y;
                maxX = Math.max(maxX, c.x + PAL_CW);
                const failedRound = c.pending && ch.status === 'error';
                const card = el('div', 'pal-card' + (c.pending ? ' pal-pending' : '') + (failedRound ? ' pal-error' : ''));
                card.style.left = c.x + 'px'; card.style.top = c.y + 'px';
                if (failedRound) card.title = ch.errorMsg || '发送失败';
                const aTxt = c.aFull ? c.aFull.slice(0, 150)
                    : (failedRound ? '✖ ' + ((ch.errorMsg || '发送失败') + '').slice(0, 110)
                    : (c.pending ? '⏳ 等待回复…' : '（无回复内容）'));
                card.innerHTML =
                    '<div class="pal-ch"><span class="pal-dot" style="background:' + ch.color + '"></span><b>#' + c.round + '</b>' +
                    '<span class="pal-open">完整 ↗</span></div>' +
                    '<div class="pal-q"></div><div class="pal-a"></div>';
                card.querySelector('.pal-q').textContent = '👤 ' + (c.qFull.slice(0, 90) || '（无文字）');
                card.querySelector('.pal-a').textContent = '🤖 ' + aTxt;
                card.addEventListener('click', () => { if (palDragged) return; palOpenHistory(ch, c.uid); });
                c.node = card;
                world.appendChild(card);
                d.cards.push(c); d.byUid[c.uid] = c;
            });
        });
        d.w = maxX + 180; d.h = PAL_PAD_Y + d.chains.length * PAL_ROW_H + 120;
        if (!d.chains.length) {   // 【空库提示】后端+本地都无记忆时给出引导
            const hint = el('div', 'pal-world-empty');
            hint.innerHTML = '🫙 记忆库还是空的<br><b>在任意卡片聊一轮，对话会自动沉淀为宫殿的一条链</b><br>支持回溯历史记录 · 跨设备同步';
            world.appendChild(hint);
        }
        const svg = d.edges;
        svg.setAttribute('width', d.w); svg.setAttribute('height', d.h);
        let sh = '';
        d.chains.forEach(ch => ch.cards.forEach((c, ri) => {
            if (!ri) return;
            const pr = ch.cards[ri - 1], color = ch.color;
            const x1 = pr.x + PAL_CW, y1 = pr.y + 70, x2 = c.x, y2 = c.y + 70, mx = (x1 + x2) / 2;
            sh += '<path d="M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" stroke="' + color + '" stroke-width="2" fill="none" opacity="0.6"/>';
            sh += '<circle cx="' + x1 + '" cy="' + y1 + '" r="3.5" fill="' + color + '"/><circle cx="' + x2 + '" cy="' + y2 + '" r="3.5" fill="' + color + '"/>';
        }));
        svg.innerHTML = sh;
        d.chipsBox.innerHTML = '';
        d.chains.forEach(ch => {
            const s = el('span', 'pal-chip');
            s.innerHTML = '<span class="pal-dot" style="background:' + ch.color + '"></span>' + palEsc(ch.label);
            s.addEventListener('click', () => { ch.enabled = !ch.enabled; s.classList.toggle('off', !ch.enabled); palSyncChainVis(); palDoSearch(); });
            d.chipsBox.appendChild(s);
        });
        palSyncChainVis();
    }

    function palSyncChainVis() {
        palUI.cards.forEach(c => c.node.classList.toggle('pal-dim', !c.chain.enabled || (palUI.failOnly && c.chain.status !== 'error')));
    }

    function palClamp(v, a, b) { const lo = Math.min(a, b), hi = Math.max(a, b); return Math.min(Math.max(v, lo), hi); }
    function palApply() {
        const d = palUI, cv = d.canvas;
        d.v.x = palClamp(d.v.x, cv.clientWidth - d.w * d.v.s - 400, 400);
        d.v.y = palClamp(d.v.y, cv.clientHeight - d.h * d.v.s - 400, 400);
        d.world.style.transform = 'translate(' + d.v.x + 'px,' + d.v.y + 'px) scale(' + d.v.s + ')';
        d.pct.textContent = Math.round(d.v.s * 100) + '%';
    }
    function palCenterOn(wx, wy, s2) {
        const d = palUI, cv = d.canvas;
        d.v.s = palClamp(s2 || d.v.s, 0.35, 1.8);
        d.v.x = cv.clientWidth / 2 - wx * d.v.s; d.v.y = cv.clientHeight / 2 - wy * d.v.s;
        d.world.classList.add('anim'); palApply();
        setTimeout(() => d.world.classList.remove('anim'), 520);
    }
    function palFitView() {
        const d = palUI, cv = d.canvas;
        const s = palClamp(Math.min(cv.clientWidth / (d.w + 60), cv.clientHeight / (d.h + 60)), 0.35, 1.1);
        palCenterOn(d.w / 2, d.h / 2, s);
    }

    function palBindCanvas() {
        const d = palUI, cv = d.canvas; let pan = null;
        cv.addEventListener('pointerdown', e => {
            e.preventDefault();   // 禁选字/原生拖拽（click 不受影响）
            palDragged = false;
            if (e.target.closest && e.target.closest('.pal-card')) return;   // 卡片：点击→完整历史，不进入平移
            pan = { mx: e.clientX, my: e.clientY, ox: d.v.x, oy: d.v.y, id: e.pointerId };
            cv.classList.add('dragging');
        });
        window.addEventListener('pointermove', e => {
            if (!pan || e.pointerId !== pan.id) return;
            const dx = e.clientX - pan.mx, dy = e.clientY - pan.my;
            if (Math.abs(dx) + Math.abs(dy) > 4) palDragged = true;
            d.v.x = pan.ox + dx; d.v.y = pan.oy + dy; palApply();
        });
        window.addEventListener('pointerup', e => {
            if (!pan || e.pointerId !== pan.id) return;
            pan = null; cv.classList.remove('dragging');
        });
        window.addEventListener('pointercancel', () => { pan = null; cv.classList.remove('dragging'); });
        cv.addEventListener('dragstart', e => e.preventDefault());
        cv.addEventListener('contextmenu', e => e.preventDefault());
        cv.addEventListener('wheel', e => {
            e.preventDefault();
            const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
            const wx = (mx - d.v.x) / d.v.s, wy = (my - d.v.y) / d.v.s;
            d.v.s = palClamp(d.v.s * (e.deltaY < 0 ? 1.1 : 0.9), 0.35, 1.8);
            d.v.x = mx - wx * d.v.s; d.v.y = my - wy * d.v.s;
            d.world.classList.remove('anim'); palApply();
        }, { passive: false });
        $('palZoomIn').addEventListener('click', () => palCenterOn((cv.clientWidth / 2 - d.v.x) / d.v.s, (cv.clientHeight / 2 - d.v.y) / d.v.s, d.v.s * 1.2));
        $('palZoomOut').addEventListener('click', () => palCenterOn((cv.clientWidth / 2 - d.v.x) / d.v.s, (cv.clientHeight / 2 - d.v.y) / d.v.s, d.v.s / 1.2));
        $('palFit').addEventListener('click', palFitView);
        d.input.addEventListener('input', () => { clearTimeout(d.deb); d.deb = setTimeout(palDoSearch, 180); });
        d.input.addEventListener('keydown', e => { if (e.key === 'Enter') palDoSearch(); });
    }

    function palSnippet(text, kw) {
        const i = text.toLowerCase().indexOf(kw.toLowerCase());
        const a = Math.max(0, i - 24), b = Math.min(text.length, i + kw.length + 34);
        return (a > 0 ? '…' : '') + palEsc(text.slice(a, i)) + '<mark>' + palEsc(text.slice(i, i + kw.length)) + '</mark>' + palEsc(text.slice(i + kw.length, b)) + (b < text.length ? '…' : '');
    }
    function palDoSearch() {
        const d = palUI, kw = d.input.value.trim();
        d.cards.forEach(c => c.node.classList.remove('hit', 'best'));
        d.list.innerHTML = '';
        if (!kw) { d.count.textContent = '输入关键词开始检索'; d.list.innerHTML = '<div class="pal-empty">输入关键词开始检索</div>'; return; }
        const hits = d.cards.filter(c => c.chain.enabled).map(c => {
            const qs = c.qFull.toLowerCase().split(kw.toLowerCase()).length - 1;
            const as = c.aFull.toLowerCase().split(kw.toLowerCase()).length - 1;
            return { c, score: qs * 3 + as * 2, inQ: qs > 0 };
        }).filter(h => h.score > 0).sort((a, b) => b.score - a.score);
        if (!hits.length) { d.count.textContent = '未命中任何卡片'; d.list.innerHTML = '<div class="pal-empty">没有匹配的记忆</div>'; return; }
        d.count.textContent = '命中 ' + hits.length + ' 张卡片 · 最佳 → #' + hits[0].c.round + '（' + hits[0].c.chain.label + '）';
        hits.forEach((h, i) => {
            const item = el('div', 'pal-ritem' + (i === 0 ? ' is-best' : ''));
            item.innerHTML = '<div class="pal-rhead">#' + h.c.round + ' · ' + palEsc(h.c.chain.label) + ' · 匹配 ' + h.score + '</div><div class="pal-rsnip">' + palSnippet(h.inQ ? h.c.qFull : h.c.aFull, kw) + '</div>';
            item.addEventListener('click', () => palFocusCard(h.c));
            d.list.appendChild(item);
            h.c.node.classList.add('hit');
        });
        palFocusCard(hits[0].c);
    }
    function palFocusCard(c) {
        palUI.cards.forEach(x => x.node.classList.remove('best'));
        c.node.classList.remove('best'); void c.node.offsetWidth;
        c.node.classList.add('best');
        palCenterOn(c.x + PAL_CW / 2, c.y + 70, Math.max(palUI.v.s, 0.95));
    }

    function palBuildUI() {
        const mask = el('div', 'pal-mask');
        mask.innerHTML =
            '<div class="pal-win">' +
              '<div class="pal-top"><span class="pal-title">🧠 记忆宫殿 · 对话思维导图</span>' +
              '<span class="pal-stat"></span><span class="pal-x">✕</span></div>' +
              '<div class="pal-body">' +
                '<div class="pal-canvas"><div class="pal-world"><svg class="pal-edges"></svg></div>' +
                  '<div class="pal-zoom"><button id="palZoomOut">−</button><span id="palPct">100%</span><button id="palZoomIn">＋</button><button id="palFit">⌖</button></div>' +
                  '<div class="pal-legend">链条 = 模型对话 · 卡片 = 一轮问答 · 时间从左到右<br>⚠ 红虚线卡 = 发送失败的记忆 · 点击卡片查看完整历史<br>拖拽平移 · 滚轮缩放 · 数据存后端，跨设备可查</div>' +
                '</div>' +
                '<div class="pal-side">' +
                  '<div class="pal-shead">🔍 记忆检索<span class="pal-failbtn" title="画布上只突出显示有发送失败的链">⚠ 只看失败</span></div>' +
                  '<input class="pal-input" placeholder="关键词搜索全部记忆，回车定位最佳">' +
                  '<div class="pal-chips"></div>' +
                  '<div class="pal-count">输入关键词开始检索</div>' +
                  '<div class="pal-list"><div class="pal-empty">输入关键词开始检索</div></div>' +
                '</div>' +
              '</div></div>';
        document.body.appendChild(mask);
        palUI = {
            mask, world: mask.querySelector('.pal-world'), canvas: mask.querySelector('.pal-canvas'),
            edges: mask.querySelector('.pal-edges'), chipsBox: mask.querySelector('.pal-chips'),
            list: mask.querySelector('.pal-list'), count: mask.querySelector('.pal-count'),
            input: mask.querySelector('.pal-input'), pct: mask.querySelector('#palPct'),
            stat: mask.querySelector('.pal-stat'), v: { x: 0, y: 0, s: 0.9 },
            chains: [], cards: [], byUid: {}, histMask: null, deb: null,
            failOnly: false, failBtn: mask.querySelector('.pal-failbtn'),
        };
        palBindCanvas();
        palUI.failBtn.addEventListener('click', () => {   // 【失败记忆】只看失败链
            palUI.failOnly = !palUI.failOnly;
            palUI.failBtn.classList.toggle('on', palUI.failOnly);
            palSyncChainVis();
        });
        mask.querySelector('.pal-x').addEventListener('click', palClose);
        mask.addEventListener('pointerdown', e => { if (e.target === mask) palClose(); });
        document.addEventListener('keydown', palKeyHandler);
    }

    function palKeyHandler(e) {
        if (e.key !== 'Escape') return;
        if (palUI && palUI.histMask) { palCloseHistory(); return; }
        if (palUI && palUI.mask.classList.contains('show')) palClose();
    }

    // 点卡片 → 完整历史弹窗（该模型全部消息），并滚动定位到点击的那一轮
    function palOpenHistory(chain, focusUid) {
        palCloseHistory();
        const total = chain.cards.filter(c => c.qFull).length + chain.cards.filter(c => c.aFull).length;
        const mask = el('div', 'pal-mask hist');
        mask.innerHTML = '<div class="pal-hmodal"><div class="modal-head"><span>🧠 ' + palEsc(chain.label) + ' · 完整历史（' + total + ' 条消息）</span><span class="modal-x">✕</span></div><div class="pal-hbody"></div></div>';
        const body = mask.querySelector('.pal-hbody');
        chain.cards.forEach(c => {
            if (c.qFull) {
                const m = el('div', 'pal-hmsg user');
                m.dataset.uid = c.uid;
                const h = el('div', 'pal-hhead', '👤 用户 · #' + c.round);
                const b = el('div', 'pal-hu'); b.textContent = c.qFull;
                m.appendChild(h); m.appendChild(b);
                if (c.pending) { const w = el('div', 'pal-hwait', '⏳ 本轮尚未收到回复'); m.appendChild(w); }
                body.appendChild(m);
                if (c.pending && chain.status === 'error') {
                    body.appendChild(el('div', 'pal-herr', '✖ 发送失败：' + (chain.errorMsg || '未知错误')));
                }
            }
            if (c.aFull) {
                const m = el('div', 'pal-hmsg bot');
                m.dataset.uid = c.uid;
                const h = el('div', 'pal-hhead', '🤖 ' + chain.label + ' · #' + c.round);
                const b = el('div', 'pal-ha'); b.innerHTML = renderMarkdown(c.aFull);
                m.appendChild(h); m.appendChild(b);
                body.appendChild(m);
            }
        });
        document.body.appendChild(mask);
        requestAnimationFrame(() => mask.classList.add('show'));
        mask.querySelector('.modal-x').addEventListener('click', palCloseHistory);
        mask.addEventListener('pointerdown', e => { if (e.target === mask) palCloseHistory(); });
        palUI.histMask = mask;
        if (focusUid) {
            let node = null;
            body.querySelectorAll('.pal-hmsg').forEach(n => { if (!node && n.dataset.uid === focusUid) node = n; });
            if (node) requestAnimationFrame(() => { node.scrollIntoView({ block: 'center' }); node.classList.add('hl'); });
        }
    }
    function palCloseHistory() {
        if (palUI && palUI.histMask) { palUI.histMask.remove(); palUI.histMask = null; }
    }

    // 【后端记忆】拉取 /memory/chats 并与本地合并：本地活跃卡永远最新；后端补充已叉掉的卡与其他设备的记录
    function palPullBackend() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        fetch('/memory/chats?limit=300', { signal: ctrl.signal })
            .then(r => r.json())
            .then(res => {
                clearTimeout(timer);
                if (!res || !res.ok || !res.data || !Array.isArray(res.data.chats)) return;
                palMergeBackend(res.data.chats);
            })
            .catch(() => clearTimeout(timer));   // 后端不可用：静默保留本地记忆
    }

    function palMergeBackend(chats) {
        const d = palUI;
        if (!d) return;
        const byId = {};
        d.chains.forEach(c => byId[c.id] = c);
        chats.forEach(rec => {
            const msgs = (rec.messages || []).filter(m => m && (m.role === 'user' || m.role === 'assistant') && (m.content || '').trim());
            if (!msgs.length) return;
            const local = byId[rec.chat_id];
            if (local && local.src === 'local') {   // 活跃卡：本地为最新，只补状态与时间
                if (rec.updated_at && rec.updated_at > (local.updatedAt || '')) local.updatedAt = rec.updated_at;
                if (rec.status === 'error' && !local.errorMsg) { local.status = 'error'; local.errorMsg = rec.error_msg; }
                return;
            }
            const chain = {
                id: rec.chat_id, label: rec.model_label || rec.model_id || rec.chat_id,
                color: PAL_COLORS[0], cards: [], enabled: true,
                status: rec.status === 'error' ? 'error' : 'ok', errorMsg: rec.error_msg || null,
                updatedAt: rec.updated_at || '', src: 'backend',
            };
            msgs.forEach(m => {
                const last = chain.cards[chain.cards.length - 1];
                if (m.role === 'user') chain.cards.push({ round: chain.cards.length + 1, qFull: m.content, aFull: '', pending: true });
                else if (last && last.pending) { last.aFull = m.content; last.pending = false; }
                else chain.cards.push({ round: chain.cards.length + 1, qFull: '', aFull: m.content, pending: false });
            });
            byId[rec.chat_id] = chain;
        });
        d.chains = Object.values(byId).sort((a, b) => (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0));
        d.chains.forEach((c, i) => { c.color = PAL_COLORS[i % PAL_COLORS.length]; });   // 重排后重发调色板
        if (!d.mask.classList.contains('show')) return;   // 弹窗已关：仅更新缓存，下次打开生效
        const kw = d.input.value.trim();
        palRender();
        d.stat.textContent = d.chains.length
            ? d.chains.length + ' 条链 · ' + d.cards.length + ' 张卡片 · 数据源：后端记忆 + 本地会话'
            : '后端记忆库暂无档案：在卡片里聊一轮即自动沉淀到这里';
        if (kw) palDoSearch();
    }

    function palOpen() {
        const chains = palBuildData();
        if (!palUI) palBuildUI();
        palUI.chains = chains;
        palUI.input.value = '';
        palUI.count.textContent = '输入关键词开始检索';
        palUI.list.innerHTML = '<div class="pal-empty">输入关键词开始检索</div>';
        palRender();
        palUI.stat.textContent = chains.length
            ? chains.length + ' 条链 · ' + palUI.cards.length + ' 张卡片 · 数据源：本地会话记忆（正在拉取后端…）'
            : '正在从后端记忆库加载历史档案…';
        palUI.mask.classList.add('show');
        setTimeout(palFitView, 40);   // 布局完成后再自适应全览
        palPullBackend();             // 【后端记忆】不再设本地闸门：打开即拉取，没聊天也能看历史
    }


    function palClose() { if (palUI) { palUI.mask.classList.remove('show'); palCloseHistory(); } }

    window.palOpen = palOpen;   // 契约入口
    $('palaceBtn').addEventListener('click', palOpen);

    async function boot() {
        try { const saved = localStorage.getItem('mt_theme'); if (saved) setTheme(saved); } catch(e){}
        ensureEmptyHint();
        await refreshModels();
        await restoreChats();   // 【持久化】模型就绪后恢复上次对话
        loadBalances();  // 【计费P1】模型就绪后拉一次上游余额
        updateStageRows();
        updateCounters();
    }
    window.refreshModels = refreshModels;   // 暴露给弹窗脚本块调用
    window.loadBalances = loadBalances;     // 【计费P1】注册新模型后刷新余额
    boot();
</script>

                <span class="hint">⚠️ 项目接口契约始终拼在约束词之后，且不可在此修改。</span>
            </div>

<script>
    // ================= 弹窗逻辑（独立块，DOMContentLoaded 后执行，避免被其它脚本错误连累） =================
    (function () {
        function openModal(id) {
            var m = document.getElementById(id);
            if (m) m.classList.add('show');
        }
        function closeModal(id) {
            var m = document.getElementById(id);
            if (m) m.classList.remove('show');
        }
        function showMsg(id, text, ok) {
            var m = document.getElementById(id);
            if (!m) return;
            m.textContent = text;
            m.className = 'modal-msg ' + (ok ? 'ok' : 'err');
        }
        // 暴露到全局，供 HTML 内联 onclick 使用
        window.openModal = openModal;
        window.closeModal = closeModal;

        function init() {
            // ---- 接入模型 ----
            var btnAdd = document.getElementById('btnAddModel');
            if (btnAdd) btnAdd.onclick = function () {
                ['amId','amKey','amUrl','amLabel'].forEach(function(i){
                    var el = document.getElementById(i); if (el) el.value = '';
                });
                var v = document.getElementById('amVision'); if (v) v.checked = false;
                var m = document.getElementById('addModelMsg'); if (m) m.className = 'modal-msg';
                openModal('addModelModal');
            };

            var amSubmit = document.getElementById('amSubmit');
            if (amSubmit) amSubmit.onclick = async function () {
                var body = {
                    id: document.getElementById('amId').value.trim(),
                    api_key: document.getElementById('amKey').value.trim(),
                    base_url: document.getElementById('amUrl').value.trim(),
                    label: document.getElementById('amLabel').value.trim(),
                    vision: document.getElementById('amVision').checked,
                };
                if (!body.id || !body.api_key || !body.base_url) {
                    showMsg('addModelMsg', '模型 ID / API Key / Base URL 均为必填', false); return;
                }
                try {
                    var res = await fetch('/models/register', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify(body),
                    });
                    var data = await res.json();
                    if (data.ok) {
                        showMsg('addModelMsg', '✅ 接入成功：' + (data.data && data.data.label), true);
                        if (window.refreshModels) await window.refreshModels();
                        if (window.loadBalances) window.loadBalances();
                        setTimeout(function(){ closeModal('addModelModal'); }, 700);
                    } else {
                        showMsg('addModelMsg', '❌ ' + (data.error || '接入失败'), false);
                    }
                } catch (e) { showMsg('addModelMsg', '❌ 请求失败：' + e, false); }
            };

            // ---- 约束词：由左侧每个模型项的 ⚙ 按钮触发 openConstraint() ----

            var ctSubmit = document.getElementById('ctSubmit');
            if (ctSubmit) ctSubmit.onclick = async function () {
                try {
                    var res = await fetch('/models/constraints', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ model: window.CT_MODEL || '', constraint: document.getElementById('ctText').value }),
                    });
                    var data = await res.json();
                    if (data.ok) {
                        showMsg('constraintMsg',
                            data.data.is_default ? '✅ 已恢复默认约束词' : '✅ 约束词已保存（下一轮对话生效）', true);
                        if (data.data.is_default) document.getElementById('ctText').value = '';
                    } else { showMsg('constraintMsg', '❌ ' + (data.error || '保存失败'), false); }
                } catch (e) { showMsg('constraintMsg', '❌ 请求失败：' + e, false); }
            };

            var ctReset = document.getElementById('ctReset');
            if (ctReset) ctReset.onclick = async function () {
                try {
                    var res = await fetch('/models/constraints', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ model: window.CT_MODEL || '', constraint: '' }),
                    });
                    var data = await res.json();
                    if (data.ok) {
                        document.getElementById('ctText').value = '';
                        showMsg('constraintMsg', '✅ 已恢复默认约束词', true);
                    } else { showMsg('constraintMsg', '❌ ' + (data.error || '操作失败'), false); }
                } catch (e) { showMsg('constraintMsg', '❌ 请求失败：' + e, false); }
            };

            // ---- 💳 计费管理（P1）：Key 绑定 / 我的余额 / 管理操作 / 流水 ----
            var BK_LS = 'mt_billing_key', AD_LS = 'mt_admin_token';
            function getStored(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
            function setStored(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
            function fmtTokens(n) { n = Number(n) || 0; return n >= 10000 ? (n / 10000).toFixed(1) + 'w' : String(n); }
            function adminHeaders() {
                var h = { 'Content-Type': 'application/json' };
                var t = getStored(AD_LS); if (t) h['X-Admin-Token'] = t;
                return h;
            }
            function refreshBillPill() {
                var key = getStored(BK_LS);
                var pill = document.getElementById('billingPill');
                if (!pill) return;
                if (!key) { pill.style.display = 'none'; return; }
                fetch('/billing/balance', { headers: { 'Authorization': 'Bearer ' + key } })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (d.ok) {
                            document.getElementById('billingBox').textContent = fmtTokens(d.data.balance);
                            pill.style.display = '';
                            pill.title = '账户 ' + d.data.user_id + ' · 累计已用 ' + fmtTokens(d.data.total_used) + '（计费管理中可解绑）';
                        } else { pill.style.display = 'none'; }
                    }).catch(function () {});
            }
            // ================= 【导出P1】一键导出当前对话（纯前端，零后端依赖） =================
    // task.messages 字段契约（533 行冻结注释）：[{role:'user'|'assistant', content:string}]
    // ExportPayload = { schema:'mt.export.v1', exported_at:int, platform:string,
    //   session_tokens:int, threads:[{task_id, model_id, model_label, status,
    //   tokens:{prompt,completion,total}, messages:[{role,content}]}] }
    var EXPORT_STATUS_CN = { idle:'待机', running:'生成中', done:'完成', error:'出错', removed:'已移除' };
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function fmtDateTime(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate())
            + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }
    function stampName() {
        var d = new Date();
        return '' + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate())
            + '_' + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
    }
    function showToast(text, ok) {
        var t = document.getElementById('toast');
        if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
        t.textContent = text;
        t.className = 'show';
        if (ok === false) t.style.borderLeftColor = 'var(--err)'; else t.style.borderLeftColor = '';
        clearTimeout(t._tm);
        t._tm = setTimeout(function () { t.className = ''; }, 2000);
    }
    /** 组装导出数据；无任何含消息的卡片时返回 null */
    function buildExportPayload() {
        var threads = (tasks || []).filter(function (t) { return t.messages && t.messages.length; });
        if (!threads.length) return null;
        return {
            schema: 'mt.export.v1',
            exported_at: Math.floor(Date.now() / 1000),
            platform: '多模型编排平台',
            session_tokens: sessionTokens || 0,
            threads: threads.map(function (t) {
                return {
                    task_id: t.task_id, model_id: t.model_id,
                    model_label: t.model_label || t.model_id, status: t.status,
                    tokens: t.tokens || { prompt: 0, completion: 0, total: 0 },
                    messages: t.messages.filter(function (m) { return (m.role === 'user' || m.role === 'assistant') && m.content; }).map(function (m) { return { role: m.role, content: m.content }; })
                };
            })
        };
    }
    /** ExportPayload → Markdown 文本（用户消息折叠为引用块，助手消息保留原文渲染） */
    function exportToMarkdown(p) {
        var head = '# 对话导出\n\n'
            + '- 导出时间：' + fmtDateTime(new Date(p.exported_at * 1000)) + '\n'
            + '- 平台：' + p.platform + '\n'
            + '- 卡片：' + p.threads.length + ' ｜ 累计 tokens：' + (p.session_tokens || 0) + '\n\n---\n\n';
        var body = p.threads.map(function (t) {
            var lines = ['## 🤖 ' + (t.model_label || t.model_id)
                + '（' + (EXPORT_STATUS_CN[t.status] || t.status) + ' · ' + ((t.tokens && t.tokens.total) || 0) + ' tokens）\n'];
            t.messages.filter(function (m) { return (m.role === 'user' || m.role === 'assistant') && m.content; }).forEach(function (m) {
                if (m.role === 'user') {
                    lines.push('**👤 用户**\n');
                    lines.push(m.content.split('\n').map(function (l) { return '> ' + l; }).join('\n') + '\n');
                } else {
                    lines.push('**🤖 助手**\n');
                    lines.push(m.content + '\n');
                }
            });
            return lines.join('\n');
        }).join('\n---\n\n');
        return head + body;
    }
    function downloadTextFile(filename, content, mime) {
        var blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
    /**
     * 【导出P1】导出当前会话（唯一入口，供菜单与控制台调用）
     * @param {'md'|'json'|'copy'} fmt
     * @returns {Promise<{ok:boolean, filename?:string, error?:string|null}>}
     */
    async function exportSession(fmt) {
        closeExportMenu();
        var p = buildExportPayload();
        if (!p) { showToast('当前没有可导出的对话（所有卡片都是空的）', false); return { ok: false, error: 'empty' }; }
        var ts = stampName();
        if (fmt === 'json') {
            var fn = '对话导出_' + ts + '.json';
            downloadTextFile(fn, JSON.stringify(p, null, 2), 'application/json');
            showToast('✅ 已导出 JSON（' + p.threads.length + ' 张卡片）');
            return { ok: true, filename: fn };
        }
        var md = exportToMarkdown(p);
        if (fmt === 'copy') {
            try { await navigator.clipboard.writeText(md); showToast('✅ 全文已复制到剪贴板'); return { ok: true }; }
            catch (e) { showToast('❌ 复制失败：' + e, false); return { ok: false, error: String(e) }; }
        }
        var fn2 = '对话导出_' + ts + '.md';
        downloadTextFile(fn2, md, 'text/markdown');
        showToast('✅ 已导出 Markdown（' + p.threads.length + ' 张卡片）');
        return { ok: true, filename: fn2 };
    }
    function openExportMenu() {
        var menu = document.getElementById('exportMenu'), btn = document.getElementById('exportBtn');
        if (!menu || !btn) return;
        if (menu.classList.contains('show')) { closeExportMenu(); return; }
        var r = btn.getBoundingClientRect();
        menu.style.top = (r.bottom + 6) + 'px';
        menu.style.left = 'auto';
        menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
        menu.classList.add('show');
    }
    function closeExportMenu() { var m = document.getElementById('exportMenu'); if (m) m.classList.remove('show'); }
    (function bindExport() {
        var btn = document.getElementById('exportBtn');
        if (btn) btn.addEventListener('click', function (e) { e.stopPropagation(); openExportMenu(); });
        var menu = document.getElementById('exportMenu');
        if (menu) menu.querySelectorAll('.ex-item').forEach(function (it) {
            it.addEventListener('click', function () { exportSession(it.getAttribute('data-fmt')); });
        });
        document.addEventListener('click', function (e) {
            var m = document.getElementById('exportMenu');
            if (m && m.classList.contains('show') && !m.contains(e.target) && e.target.id !== 'exportBtn') closeExportMenu();
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeExportMenu(); });
    })();
    window.exportSession = exportSession;       // 暴露：控制台可 await exportSession('md')
    window.buildExportPayload = buildExportPayload;
    window.refreshBillPill = refreshBillPill;

            function myBalance() {
                var key = getStored(BK_LS);
                var box = document.getElementById('bkMyInfo');
                if (!key) { box.textContent = '未绑定 Key（匿名模式，不扣费）'; return; }
                box.textContent = '查询中…';
                fetch('/billing/balance', { headers: { 'Authorization': 'Bearer ' + key } })
                    .then(function (r) { return r.json(); }).then(function (d) {
                        box.textContent = d.ok
                            ? '✅ 账户 ' + d.data.user_id + ' · 剩余 ' + d.data.balance + ' tokens · 累计已用 ' + d.data.total_used
                            : '❌ ' + (d.error || '查询失败');
                    }).catch(function () { box.textContent = '❌ 请求失败'; });
            }

            function renderKeys() {
                var box = document.getElementById('bkKeys');
                if (!box) return;
                fetch('/billing/keys', { headers: adminHeaders() })
                    .then(function (r) { return r.json(); }).then(function (d) {
                        if (!d.ok) { box.innerHTML = '<div>❌ ' + (d.error || '加载失败') + '</div>'; return; }
                        var keys = d.data.keys || [];
                        if (!keys.length) { box.innerHTML = '<div>暂无 Key，先在上方签发一个</div>'; return; }
                        box.innerHTML = '';
                        keys.forEach(function (k) {
                            var row = document.createElement('div'); row.className = 'bill-krow';
                            var info = document.createElement('span'); info.className = 'grow';
                            info.textContent = k.api_key.slice(0, 10) + '***' + k.api_key.slice(-4)
                                + ' · ' + k.user_id + ' · 余 ' + fmtTokens(k.balance) + (k.disabled ? ' · 已禁用' : '');
                            row.appendChild(info);
                            function mkBtn(txt, fn, title) {
                                var b = document.createElement('button'); b.textContent = txt;
                                if (title) b.title = title; b.onclick = fn; return b;
                            }
                            row.appendChild(mkBtn('复制', function () {
                                try { navigator.clipboard.writeText(k.api_key); showMsg('billingMsg', '✅ 完整 Key 已复制到剪贴板', true); } catch (e) {}
                            }, '复制完整 Key（仅本弹窗可见）'));
                            row.appendChild(mkBtn('+充', function () {
                                var t = prompt('给账户「' + k.user_id + '」充值多少 tokens？', '10000');
                                if (!t) return;
                                fetch('/billing/recharge', { method: 'POST', headers: adminHeaders(), body: JSON.stringify({ api_key: k.api_key, tokens: Number(t) || 0 }) })
                                    .then(function (r) { return r.json(); }).then(function (d2) {
                                        showMsg('billingMsg', d2.ok ? '✅ 充值成功，剩余 ' + d2.data.balance : '❌ ' + (d2.error || '充值失败'), !!d2.ok);
                                        renderKeys(); refreshBillPill();
                                    }).catch(function () {});
                            }, '充值'));
                            row.appendChild(mkBtn(k.disabled ? '启用' : '禁用', function () {
                                fetch('/billing/keys/disable', { method: 'POST', headers: adminHeaders(), body: JSON.stringify({ api_key: k.api_key, disabled: !k.disabled }) })
                                    .then(function (r) { return r.json(); }).then(function (d2) {
                                        if (!d2.ok) showMsg('billingMsg', '❌ ' + (d2.error || '操作失败'), false);
                                        renderKeys();
                                    }).catch(function () {});
                            }));
                            box.appendChild(row);
                        });
                    }).catch(function () { box.innerHTML = '<div>❌ 请求失败</div>'; });
            }

            var btnB = document.getElementById('btnBilling');
            if (btnB) btnB.onclick = function () {
                document.getElementById('bkMyKey').value = getStored(BK_LS);
                document.getElementById('bkAdmin').value = getStored(AD_LS);
                showMsg('billingMsg', '', true);
                openModal('billingModal');
                myBalance(); renderKeys();
            };
            var bkSaveKey = document.getElementById('bkSaveKey');
            if (bkSaveKey) bkSaveKey.onclick = function () {
                var v = document.getElementById('bkMyKey').value.trim();
                if (!v) { showMsg('billingMsg', '❌ Key 不能为空', false); return; }
                setStored(BK_LS, v);
                showMsg('billingMsg', '✅ 已绑定（保存在浏览器本地）', true);
                refreshBillPill(); myBalance();
            };
            var bkUnbind = document.getElementById('bkUnbind');
            if (bkUnbind) bkUnbind.onclick = function () {
                setStored(BK_LS, '');
                document.getElementById('bkMyKey').value = '';
                showMsg('billingMsg', '✅ 已解绑，恢复匿名模式', true);
                refreshBillPill(); myBalance();
            };
            var bkSaveAdmin = document.getElementById('bkSaveAdmin');
            if (bkSaveAdmin) bkSaveAdmin.onclick = function () {
                setStored(AD_LS, document.getElementById('bkAdmin').value.trim());
                showMsg('billingMsg', '✅ 管理员令牌已保存（仅本地）', true);
                renderKeys();
            };
            var bkCreate = document.getElementById('bkCreate');
            if (bkCreate) bkCreate.onclick = function () {
                var uid = document.getElementById('bkUid').value.trim();
                var init = Number(document.getElementById('bkInit').value) || 0;
                if (!uid) { showMsg('billingMsg', '❌ 请填写用户名', false); return; }
                fetch('/billing/keys', { method: 'POST', headers: adminHeaders(), body: JSON.stringify({ user_id: uid, init_tokens: init }) })
                    .then(function (r) { return r.json(); }).then(function (d) {
                        if (d.ok) {
                            showMsg('billingMsg', '✅ 已签发：' + d.data.api_key + '（完整 Key 仅显示这一次，可点下方列表「复制」，或填到上面点「绑定」）', true);
                            document.getElementById('bkMyKey').value = d.data.api_key;
                            document.getElementById('bkUid').value = '';
                            renderKeys();
                        } else { showMsg('billingMsg', '❌ ' + (d.error || '签发失败'), false); }
                    }).catch(function () { showMsg('billingMsg', '❌ 请求失败', false); });
            };
            var bkRefreshKeys = document.getElementById('bkRefreshKeys');
            if (bkRefreshKeys) bkRefreshKeys.onclick = renderKeys;
            var bkLogs = document.getElementById('bkLogs');
            if (bkLogs) bkLogs.onclick = function () {
                var box = document.getElementById('bkLog');
                box.textContent = '加载中…';
                fetch('/billing/logs?limit=20', { headers: adminHeaders() })
                    .then(function (r) { return r.json(); }).then(function (d) {
                        if (!d.ok) { box.textContent = '❌ ' + (d.error || '加载失败'); return; }
                        var items = d.data.logs || [];
                        if (!items.length) { box.textContent = '暂无流水'; return; }
                        box.innerHTML = '';
                        items.forEach(function (g) {
                            var div = document.createElement('div');
                            var t = new Date(g.ts * 1000).toLocaleTimeString();
                            div.textContent = t + ' · ' + (g.source || '-') + (g.model ? ' · ' + g.model : '')
                                + ' · ' + (g.tokens >= 0 ? '+' + g.tokens : g.tokens) + ' → 余 ' + g.balance_after;
                            box.appendChild(div);
                        });
                    }).catch(function () { box.textContent = '❌ 请求失败'; });
            };

            // ---- 遮罩点击 / ESC 关闭（用 onclick，稳定） ----
            var masks = document.querySelectorAll('.modal-mask');
            for (var i = 0; i < masks.length; i++) {
                (function (mask) {
                    mask.onclick = function (e) { if (e.target === mask) mask.classList.remove('show'); };
                })(masks[i]);
            }
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    var open = document.querySelectorAll('.modal-mask.show');
                    for (var j = 0; j < open.length; j++) open[j].classList.remove('show');
                }
            });
            refreshBillPill();   // 【计费P1】已绑定 Key 则恢复顶栏余额显示
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
